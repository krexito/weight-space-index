[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weight-space-index"
version = "0.2.0"
description = "Semantic and structural Weight-Space Index (WSI) for LLMs: navigate, diff, align, and surgically edit neural network weights without training or inference."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "torch>=2.1",
    "safetensors>=0.4",
]

[project.optional-dependencies]
benchmarks = [
    "transformers>=4.38",
    "psutil>=5.9",
]
dev = [
    "pytest>=7.0",
    "transformers>=4.38",
    "psutil>=5.9",
]

[project.scripts]
wsi = "wsi.cli:main"

[tool.setuptools.packages.find]
include = ["wsi*"]
